id: ambient-clock-in-controller
language: TypeScript
severity: warning
message: >-
  Ambient wall-clock read in a controller — inject a clock and take business time in the service, so the
  handler can be tested at a fixed instant.
note: >-
  Ambient reads only: `new Date()` / `new Date` / `new globalThis.Date()`, `Date.now()`, `Date['now']()`,
  `globalThis.Date.now()`. An injected `this.clock.now()` is NOT matched, nor is `new Date(value)`, which
  parses a value rather than reading the clock. Never matches inside a comment or a string.
files:
  - src/**/*.controller.ts
  - src/**/controllers/**/*.ts
ignores:
  - '**/*.spec.ts'
  - '**/*.test.ts'
utils:
  date-ctor:
    regex: '^((globalThis|window|global)\s*\.\s*)?Date$'
rule:
  any:
    - kind: new_expression
      all:
        - has: { field: constructor, matches: date-ctor }
        - not: { has: { field: arguments, has: { nthChild: 1 } } }
    - kind: call_expression
      has:
        field: function
        any:
          - kind: member_expression
            all:
              - has: { field: object, matches: date-ctor }
              - has: { field: property, regex: '^now$' }
          - kind: subscript_expression
            all:
              - has: { field: object, matches: date-ctor }
              - has: { field: index, regex: "^['\"`]now['\"`]$" }
