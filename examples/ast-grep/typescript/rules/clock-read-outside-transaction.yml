id: clock-read-outside-transaction
language: TypeScript
severity: warning
message: >-
  Clock read outside the transaction callback in a method that opens one — the instant is taken before (or
  after) the transaction it stamps, so a retry or a lock wait makes it stale.
note: >-
  APPROXIMATION (ast-grep has no data flow): matches `<...clock>.now()` inside a method or function that also
  calls `<tx|txRunner|transactionRunner|transactions>.run(<callback>)`, when the read is not itself inside a
  `.run(...)` call. It cannot see a transaction opened in a helper the method delegates to, nor tell whether
  the pre-read instant is actually used inside the callback. Rename the object regexes to your runner.
files:
  - src/**/*.ts
ignores:
  - '**/*.spec.ts'
  - '**/*.test.ts'
utils:
  clock-read:
    kind: call_expression
    has:
      field: function
      kind: member_expression
      all:
        - has: { field: property, regex: '^now$' }
        - has: { field: object, regex: '(?i)clock$' }
  tx-run:
    kind: call_expression
    all:
      - has:
          field: function
          kind: member_expression
          all:
            - has: { field: property, regex: '^run$' }
            - has: { field: object, regex: '(^|\.)(tx|txRunner|transactionRunner|transactions)$' }
      - has:
          field: arguments
          has:
            nthChild: 1
            any: [{ kind: arrow_function }, { kind: function_expression }]
rule:
  matches: clock-read
  inside:
    stopBy: end
    any: [{ kind: method_definition }, { kind: function_declaration }]
    has: { stopBy: end, matches: tx-run }
  not:
    inside: { stopBy: end, matches: tx-run }
